<!doctype html>
<html lang="eu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TALDE ELKARRERAGILEAK</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;min-height:100vh;font-family:"Trebuchet MS",Arial,sans-serif;color:#26354b;background:radial-gradient(ellipse at 8% 12%,#ffb347 0 0.5%,transparent 30%),radial-gradient(ellipse at 92% 18%,#9b7bff 0 0.5%,transparent 32%),radial-gradient(ellipse at 80% 92%,#42d6c5 0 0.5%,transparent 34%),radial-gradient(ellipse at 12% 88%,#ff6f91 0 0.5%,transparent 28%),linear-gradient(135deg,#202b5b,#344b78 48%,#25365e)}
.board{max-width:1500px;margin:auto;min-height:calc(100vh - 36px);display:flex;flex-direction:column;gap:15px}
header{position:relative;text-align:center;background:linear-gradient(110deg,#fff7d6 0%,#ffffff 38%,#f5e5ff 72%,#dffaff 100%);border:4px solid #fff;border-radius:32px;padding:18px;box-shadow:0 10px 28px #101b3d55;overflow:hidden}
h1{font-family:"Cooper Black","Arial Rounded MT Bold",Georgia,serif;font-size:clamp(2rem,4vw,3.35rem);margin:0;font-weight:1000;letter-spacing:.055em;line-height:1.12;color:#55328b;text-shadow:2px 3px 0 #ffd166,4px 5px 0 #ff8fab,-1px -1px 0 #fff;transform:rotate(-.5deg)}.sub{margin:8px 0 0;color:#435078;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.symbol{position:absolute;font-size:2.5rem;font-weight:1000;opacity:.2}.s1{left:12%;top:0;color:#e76f51}.s2{right:14%;top:0;color:#6a4c93}.s3{left:24%;bottom:0;color:#2a9d8f}
.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;flex:1}
.corner{border:4px solid white;border-radius:30px;padding:18px;display:flex;flex-direction:column;gap:11px;min-height:430px;box-shadow:0 9px 22px #26354b18;position:relative;overflow:hidden}
.corner:after{content:attr(data-symbol);position:absolute;right:14px;top:2px;font-size:5rem;font-weight:1000;opacity:.12;pointer-events:none}
.pink{background:linear-gradient(145deg,#ff477e,#ff86a5);border-color:#fff2f6}.blue{background:linear-gradient(145deg,#2878ff,#62b5ff);border-color:#eff7ff}.green{background:linear-gradient(145deg,#22b85a,#8bdd45);border-color:#f2fff0}
.c-head{display:flex;align-items:center;gap:11px;position:relative;z-index:1}.dot{width:45px;height:45px;border-radius:16px;background:white;display:grid;place-items:center;font-size:1.5rem;box-shadow:0 3px 8px #26354b18}
.c-title{flex:1;min-width:0}.c-title input{width:100%;font:1000 clamp(1.15rem,1.8vw,1.6rem) "Trebuchet MS";color:#fff;text-shadow:0 2px 3px #26354b55;border:0;border-bottom:2px dashed #ffffffb8;background:transparent;outline:none;padding:4px 0}
.deco{display:flex;justify-content:space-around;align-items:center;font-size:clamp(1.7rem,2.7vw,2.5rem);padding:8px 0;opacity:1;text-shadow:0 2px 2px #26354b22}
.prompt{font-weight:1000;font-size:1rem;color:#fff;text-shadow:0 2px 3px #26354b55}.topic{flex:1;min-height:190px;width:100%;resize:none;border:3px solid #ffffff;border-radius:22px;background:#ffffffed;padding:16px;font:600 clamp(1rem,1.4vw,1.2rem)/1.5 "Trebuchet MS";color:#26354b;outline:none;box-shadow:0 5px 14px #26354b18}.topic:focus{background:white;border-color:#718096}.topic::placeholder{color:#7b8799}
.foot{display:none}
.timer{background:linear-gradient(90deg,#fff2c9,#fff,#e9e2ff);border:4px solid white;border-radius:26px;padding:12px 18px;display:flex;align-items:center;justify-content:center;gap:17px;flex-wrap:wrap;box-shadow:0 8px 22px #26354b14}
.tlabel{font-weight:1000;font-size:1.1rem}.clock-illustration{width:52px;height:52px;border:5px solid #ffb52e;border-radius:50%;background:#fffdf4;position:relative;display:inline-block;box-shadow:0 4px 0 #e98c39}.clock-illustration:before{content:'';position:absolute;width:18px;height:7px;border-radius:6px;background:#ffb52e;left:12px;top:-11px}.clock-illustration:after{content:'•';position:absolute;left:18px;top:12px;color:#ff8b45;font-size:18px}.clock-illustration i{position:absolute;width:4px;height:15px;border-radius:4px;background:#574b90;left:20px;top:7px;transform-origin:bottom;transform:rotate(0deg)}.clock-illustration b{position:absolute;width:14px;height:4px;border-radius:4px;background:#574b90;left:20px;top:21px;transform-origin:left;transform:rotate(25deg)}.clock-illustration em{position:absolute;width:6px;height:6px;border-radius:50%;background:#ff7c59;left:18px;top:18px}.time{font-size:clamp(2rem,3vw,2.8rem);font-weight:1000;font-variant-numeric:tabular-nums;min-width:120px;text-align:center;color:#574b90}
.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}button{border:0;border-radius:13px;padding:9px 13px;font:800 .9rem "Trebuchet MS";cursor:pointer;background:#f0edff;color:#41386c}button:hover{filter:brightness(.97);transform:translateY(-1px)}button.main{background:#574b90;color:white}input.minutes{width:58px;border:2px solid #e4e0f4;border-radius:10px;padding:8px;text-align:center;font-weight:800}
.tools{display:flex;justify-content:flex-end;gap:7px}.tools button{font-size:.78rem;padding:7px 10px}
@media(max-width:760px){body{padding:10px}.columns{gap:9px}.corner{padding:12px;min-height:360px;border-radius:22px}}
@media(max-width:560px){.columns{grid-template-columns:1fr}.corner{min-height:280px}.topic{min-height:130px}.timer{gap:9px}}
@media print{body{padding:0;background:white}.tools{display:none}}
</style></head><body><div class="board">
<header><span class="symbol s1">＋</span><span class="symbol s2">÷</span><span class="symbol s3">×</span><h1>TALDE ELKARRERAGILEAK</h1><p class="sub">Pentsatu · Partekatu · Elkarrekin ikasi</p></header>
<main class="columns">
<section class="corner pink" data-symbol="＋"><div class="c-head"><div class="dot">🔴</div><div class="c-title"><input id="name0" aria-label="Lehen taldearen izena" value="1. TALDEA"></div></div><div class="deco"><span>🧮</span><span>＋</span><span>🔢</span><span>📐</span></div><label class="prompt" for="topic0">ZER LANDUKO DUGU?</label><textarea class="topic" id="topic0" placeholder="Idatzi hemen talde honetan landuko duzuena..."></textarea></section>
<section class="corner blue" data-symbol="÷"><div class="c-head"><div class="dot">🔵</div><div class="c-title"><input id="name1" aria-label="Bigarren taldearen izena" value="2. TALDEA"></div></div><div class="deco"><span>📏</span><span>÷</span><span>📊</span><span>🔷</span></div><label class="prompt" for="topic1">ZER LANDUKO DUGU?</label><textarea class="topic" id="topic1" placeholder="Idatzi hemen talde honetan landuko duzuena..."></textarea></section>
<section class="corner green" data-symbol="×"><div class="c-head"><div class="dot">🟢</div><div class="c-title"><input id="name2" aria-label="Hirugarren taldearen izena" value="3. TALDEA"></div></div><div class="deco"><span>🎲</span><span>×</span><span>🧩</span><span>📈</span></div><label class="prompt" for="topic2">ZER LANDUKO DUGU?</label><textarea class="topic" id="topic2" placeholder="Idatzi hemen talde honetan landuko duzuena..."></textarea></section>
</main>
<section class="timer"><span class="clock-illustration" aria-hidden="true"><i></i><b></b><em></em></span><span class="tlabel">⏱ KRONOMETROA</span><span class="time" id="display">30:00</span><div class="controls"><label for="mins">Minutuak</label><input class="minutes" id="mins" type="number" min="1" max="180" value="30"><button class="main" id="start">▶ Hasi</button><button id="pause">Ⅱ Pausatu</button><button id="reset">↺ Berrabiarazi</button><button id="five">5 min</button><button id="ten">10 min</button><button id="fifteen">15 min</button><button id="thirty">30 min</button></div></section>
<div class="tools"><button id="save">💾 Gorde arbela</button><button id="clear">Garbitu testuak</button></div></div>
<script>
const ids=["name0","topic0","name1","topic1","name2","topic2"];
function save(){let d={};ids.forEach(i=>d[i]=document.getElementById(i).value);try{localStorage.setItem("taldeElkarreragileak",JSON.stringify(d))}catch(e){}}
function load(){try{let d=JSON.parse(localStorage.getItem("taldeElkarreragileak")||"{}");ids.forEach(i=>{if(d[i]!==undefined)document.getElementById(i).value=d[i]})}catch(e){}}
ids.forEach(i=>document.getElementById(i).addEventListener("input",save));load();
document.getElementById("save").onclick=()=>{save();let d={};ids.forEach(i=>d[i]=document.getElementById(i).value);let a=document.createElement("a"),b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});a.href=URL.createObjectURL(b);a.download="talde-elkarreragileak.json";a.click();URL.revokeObjectURL(a.href)};
document.getElementById("clear").onclick=()=>{if(confirm("Ziur zaude hiru taldeetako testuak ezabatu nahi dituzula?")){["topic0","topic1","topic2"].forEach(i=>document.getElementById(i).value="");save()}};
let remaining=1800,interval=null,endAt=0,display=document.getElementById("display"),mins=document.getElementById("mins");
function draw(){display.textContent=String(Math.floor(remaining/60)).padStart(2,"0")+":"+String(remaining%60).padStart(2,"0")}
function pause(){if(interval){clearInterval(interval);interval=null;remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));draw()}}
function setTime(m){pause();remaining=Math.max(1,Math.min(180,Number(m)||30))*60;mins.value=Math.floor(remaining/60);draw()}
function start(){if(interval)return;if(remaining<=0)setTime(mins.value);endAt=Date.now()+remaining*1000;interval=setInterval(()=>{remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));draw();if(!remaining){pause();display.textContent="BUKATU DA!";try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=740;g.gain.value=.12;o.start();o.stop(c.currentTime+.5)}catch(e){}}},200)}
function reset(){pause();remaining=Math.max(1,Number(mins.value)||30)*60;draw()}
document.getElementById("start").onclick=start;document.getElementById("pause").onclick=pause;document.getElementById("reset").onclick=reset;
document.getElementById("five").onclick=()=>setTime(5);document.getElementById("ten").onclick=()=>setTime(10);document.getElementById("fifteen").onclick=()=>setTime(15);document.getElementById("thirty").onclick=()=>setTime(30);mins.onchange=()=>setTime(mins.value);draw();
</script></body></html>
